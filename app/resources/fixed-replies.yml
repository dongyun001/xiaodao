# 固定话术；代码用 str.replace 渲染（不要用 str.format，话术里可能含花括号）。
#
# 可用占位符：
#   {counselor_contact}  辅导员联系方式，来自环境变量 COUNSELOR_CONTACT
#   {contact_suffix}     代码拼好的后缀，形如「（联系方式：xxx）」；未配置时为空串
#
# 红线：不要写任何具体热线、电话、网址——AGENTS 禁止编造联系方式与热线，
#      学校提供的号码只能通过 COUNSELOR_CONTACT 注入。
replies:
  empty_question: "请提出你的问题"

  crisis: |-
    你愿意说出来，这很重要。这件事需要真人尽快介入，请马上联系辅导员{contact_suffix}。
    如果你现在有伤害自己的念头，请立刻拨打当地急救电话，或让身边的同学、老师陪着你，不要独处。

  generic_emergency: |-
    听起来情况比较急。请先保证自己的安全，并尽快让真人介入：联系辅导员{contact_suffix}。
    如果涉及人身危险或需要医疗帮助，请直接拨打当地报警或急救电话，并让身边的人知晓。

  empty_section: |-
    这个问题涉及的板块，学校目前还没有在知识库里公布可依据的内容，我不能替你猜一个说法。
    你可以换个问法再试一次，或者直接联系辅导员{contact_suffix}。

  low_relevance: |-
    抱歉，学校公布的制度和通知里没有找到能回答这个问题的依据，我不能凭空给一个说法。
    你可以换个说法再问一次，或者直接联系辅导员{contact_suffix}。

  error: |-
    服务暂时不可用，请稍后再试。如果事情比较急，请直接联系辅导员{contact_suffix}。

  system_busy: |-
    系统繁忙，请稍后再试。如果事情比较急，请直接联系辅导员{contact_suffix}。

  welcome: |-
    你好，我是辅导员问答助手。你可以直接打字提问校内制度类问题，例如学籍、奖助、考勤、宿舍、就业。
    涉及个人情况、心理困扰或紧急事情，请直接联系辅导员{contact_suffix}。
