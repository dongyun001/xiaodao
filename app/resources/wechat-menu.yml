# 微信自定义菜单的 key → 点击后的回复。
#
# ⚠️ 待确认：文档只写了菜单是"6 板块 + PSYCHOLOGY + CONTACT"，具体是哪 6 个板块、
#    与 app/resources/sections.yml 的 9 个章节怎么对应，都没有写明。下面是按
#    sections.yml 铺的占位内容，等学校确认菜单后按实际 key 改这一份即可，不改代码。
#
# `PSYCHOLOGY` 与 `CONTACT` 名称来自 docs/踩坑记录.md「已知规格差异与当前取舍」。
replies:
  总则: |-
    这方面的规定我还在整理，你可以直接打字提问，或联系辅导员{contact_suffix}。
  学业教务: |-
    学业教务这块包括学籍、成绩、选课、考试等。你可以直接打字问具体问题，例如"挂科了怎么办"。
  奖助评优: |-
    奖助评优这块包括奖学金、助学金、评优等。你可以直接打字问具体问题。
  考勤请假: |-
    考勤请假这块包括请假流程、旷课认定等。你可以直接打字问具体问题。
  宿舍管理: |-
    宿舍管理这块包括门禁、用电、住宿调整等。你可以直接打字问具体问题。
  心理健康: |-
    如果你现在心里不太好受，我在这里。你可以说说发生了什么；不过更建议你直接联系辅导员{contact_suffix}聊一次，真人陪伴比文字更有用。
  就业毕业: |-
    就业毕业这块包括三方协议、报到证、离校手续等。你可以直接打字问具体问题。
  安全应急: |-
    遇到紧急情况请先保证自身安全，并立刻让真人介入：联系辅导员{contact_suffix}；涉及人身危险或需要医疗帮助，请直接拨打当地报警或急救电话。
  日常事务: |-
    日常事务这块包括证明办理、校园卡、后勤服务等。你可以直接打字问具体问题。
  PSYCHOLOGY: |-
    如果你现在心里不太好受，我在这里。你可以说说发生了什么；不过更建议你直接联系辅导员{contact_suffix}聊一次，真人陪伴比文字更有用。
  CONTACT: |-
    辅导员的联系方式请以学院公布为准。如果你不方便找，也可以在本条消息里说明情况，我记录后会转达。
